services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: obmen
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-obmen}
      POSTGRES_DB: obmen
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U obmen -d obmen"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  bot:
    build: .
    env_file: .env
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
volumes:
  postgres_data:
